
name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions: {}

jobs:
  desplegar:
    name: Desplegar API y Gradio en Render
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Desplegar FastAPI
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_API }}
        run: |
          test -n "$HOOK"
          curl --fail --show-error --silent -X POST "$HOOK"

      - name: Desplegar Gradio
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_UI }}
        run: |
          test -n "$HOOK"
          curl --fail --show-error --silent -X POST "$HOOK"
