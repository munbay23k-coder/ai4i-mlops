
name: CI

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  probar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v6

      - name: Instalar dependencias
        run: uv sync --locked

      - name: Entrenar modelo
        run: uv run entrenar

      - name: Ejecutar pruebas
        run: uv run pytest -v

      - name: Guardar modelo
        uses: actions/upload-artifact@v4
        with:
          name: modelo-ai4i
          path: models/
          retention-days: 7